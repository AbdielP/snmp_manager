version: "2.0"
services:
    php:
        build:
            context: ./
            dockerfile: dockerfile
        container_name: apache-server
        restart: always
    backend:
        build:
            context: ../snmp_server
            dockerfile: dockerfile
        container_name: snmp-backend
        restart: always
        env_file:
            - ../snmp_server/.env
    nginx:
        image: nginx:alpine
        container_name: nginx-proxy
        restart: always
        ports:
            - 80:80
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
            - backend
volumes:
    html: {}